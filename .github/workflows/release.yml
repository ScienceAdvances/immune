name: Publish to PyPI

on:
  release:
    types: [published]

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the released revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          tag_version = tag.removeprefix("v")
          with Path("pyproject.toml").open("rb") as handle:
              package_version = tomllib.load(handle)["project"]["version"]

          init_text = Path("src/immune/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', init_text, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not read immune.__version__")
          import_version = match.group(1)

          if len({tag_version, package_version, import_version}) != 1:
              raise SystemExit(
                  "Version mismatch: "
                  f"tag={tag_version}, pyproject={package_version}, import={import_version}"
              )
          print(f"Release version verified: {package_version}")
          PY

      - name: Install test and build tools
        run: python -m pip install --upgrade ".[dev]" build twine

      - name: Run code checks
        run: python -m ruff check src tests examples docs/conf.py

      - name: Run tests
        run: python -m pytest -q

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/immune
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
